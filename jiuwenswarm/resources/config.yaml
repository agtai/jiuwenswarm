  #       - type: prompt
  #         prompt: "审查命令输出安全性: $ARGUMENTS"
  #         timeout: 15

  # SessionStart: 会话开始时
  # SessionStart:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'session started'"

  # Stop: Agent 结束前
  # Stop:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'agent stopping'"


